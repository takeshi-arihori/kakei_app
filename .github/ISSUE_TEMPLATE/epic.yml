name: Epic
description: 複数Taskで届ける成果・能力
title: "epic: "
labels: ["work: epic"]
body:
  - type: markdown
    attributes:
      value: "Public Repositoryです。未分類・要編集・非公開情報を入力しないでください。単一の1〜2日作業にはTaskを使用します。Epicには目的・範囲・全Taskの一覧と依存関係だけを書き、経過や進捗の説明は書きません。一覧のTaskがすべてCloseするまでEpicはCloseしません。書き方は docs/engineering/delivery-workflow.md のEpicの節に従います。"
  - type: textarea
    id: goal
    attributes:
      label: 目的・完了したらできること
      description: なぜ必要か。完了したら誰が何をできるようになるか
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope／Out of scope
      description: 含むもの、含まないもの（別Epicへ回すものはそのEpic番号）
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: Taskと依存関係
      description: "Epicを完了させるTaskをすべて列挙する。全行をsub-issueにし、依存は`←`で書く。未起票の候補は書かない。ADR／設計 → Domain → Application → Infrastructure → Presentation → Webの順を目安に分ける"
      placeholder: |
        - [ ] #301 adr: 精算の確定方式を決める
        - [ ] #302 task: 精算の集約と値オブジェクトを実装する ← #301
        - [ ] #303 task: 精算を確定するUse Caseを実装する ← #302
    validations:
      required: true
  - type: textarea
    id: decision
    attributes:
      label: Decision Check・Related ADR
      description: 未確認／方針変更なし／方針変更あり、理由、ADRへのリンク。必要DecisionがAcceptedになるまで依存TaskをReadyにしない
    validations:
      required: true
  - type: checkboxes
    id: publication
    attributes:
      label: 公開確認
      options:
        - label: 本文・添付・参照先の機械検査と手動Reviewを完了し、公開可能と確認した
          required: true
