name: Epic
description: 複数Taskで届ける成果・能力
title: "epic: "
body:
  - type: markdown
    attributes:
      value: "Public Repositoryです。未分類・要編集・非公開情報を入力しないでください。単一の1〜2日作業にはTaskを使用します。進捗は本文に書かず、Projectに置きます。"
  - type: textarea
    id: requirement
    attributes:
      label: 目的
      description: なぜ必要か、期待成果
    validations:
      required: true
  - type: textarea
    id: planning
    attributes:
      label: Taskと依存関係
      description: Owner、Task名、依存関係、Task IssueのURL。Taskの詳細と、ProjectのFieldにある値は書かない
    validations:
      required: true
  - type: textarea
    id: decision
    attributes:
      label: Decision Check・Related ADR
      description: 未確認／方針変更なし／方針変更あり、理由、GitHub ADRへのリンク。必要DecisionがAcceptedになるまでReadyにしない
    validations:
      required: true
  - type: checkboxes
    id: publication
    attributes:
      label: 公開確認
      options:
        - label: 本文・添付・参照先の機械検査と手動Reviewを完了し、公開可能と確認した
          required: true
