name: Task
description: 1〜2日で検証できる単一成果
title: "task: "
labels: ["work: task"]
body:
  - type: markdown
    attributes:
      value: "このRepositoryはPublicです。公開確認済みの情報だけを記入してください。Notionへのアクセスは不要です。Epicの分解時と単一Taskの起票時はタイトル、親Epic（ある場合）、Dependencies、依存するDecisionだけを書き、他の欄は「着手時に記入」とします。依存するDecisionはRelated ADR欄に書き、Decision Checkは未確定なら「未確認」を選びます。Reviewの結果や作業の経過は本文に書きません。"
  - type: input
    id: epic
    attributes:
      label: 親Epic
      description: sub-issueにも設定し、EpicのTask一覧へ追加する。単独Taskなら「なし」
      placeholder: "#202"
    validations:
      required: true
  - type: dropdown
    id: layer
    attributes:
      label: 主に変更する層
      description: 分け方は docs/engineering/delivery-workflow.md の「Epic・Taskの分け方」
      multiple: true
      options:
        - ADR／設計
        - Domain
        - Application
        - Infrastructure
        - Presentation
        - Web
        - docs／Tooling／CI
    validations:
      required: false
  - type: textarea
    id: requirement
    attributes:
      label: Requirement
      description: 問題、期待結果、制約、対象外
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Done Criteria
      description: 観測可能な完了条件と検証方法
    validations:
      required: true
  - type: textarea
    id: planning
    attributes:
      label: Planning
      description: Owner、Dependencies、影響範囲。ProjectのFieldにある値は書かない
    validations:
      required: true
  - type: dropdown
    id: decision
    attributes:
      label: Decision Check
      options:
        - 未確認
        - 方針変更なし
        - 方針変更あり
    validations:
      required: true
  - type: textarea
    id: adr
    attributes:
      label: Related ADR・根拠
      description: GitHub上のADR URLと判定理由。未確認・ProposedのままReadyにしない
    validations:
      required: true
  - type: checkboxes
    id: publication
    attributes:
      label: 公開確認
      options:
        - label: 本文・添付・参照先の機械検査と手動Reviewを行い、秘密・個人情報・実在金融情報・非公開情報を含まないと確認した
          required: true
