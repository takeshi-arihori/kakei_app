name: 品質検証

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint・型・Test・Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Repositoryを取得
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: pnpmを準備
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Node.jsを準備
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: 依存関係をInstall
        run: pnpm install --frozen-lockfile

      - name: Repository全体を検証
        run: pnpm check

      - name: WebからAPIへの疎通を検証
        run: pnpm --filter @kakei/api exec vitest run test/api-connectivity.integration.spec.ts
